# Embodied Agent brain configuration. No secrets here; API keys go in .env.

[network]
# The phone reaches the brain through `adb reverse`, so it connects to localhost.
host = "127.0.0.1"
port = 8765

[body]
# Which body the brain drives: "sim" (a scripted body; needs no hardware) or "phone".
kind = "sim"

# [body.sim]
# Folders of test media for the sim body, relative to the repo. Without them it uses built-in
# synthetic pictures and tones.
# image_dir = "data/sim/images"
# audio_dir = "data/sim/audio"

[models]
live_conversation = "claude-haiku-5-5"
careful_looking = "claude-sonnet-5-5"
offline = "claude-opus-5-5"

[caps]
# Interim caps from docs/cost-estimate.md (DEC-068, answered by Jeff 13 Nov 2026). Enforced from card P0-07
# (full guard in P1-04). Each money cap must be from 0 to 100 US dollars (brain/limits.py SPEND_CAP_SANITY_MAX),
# so a typo cannot set a huge cap; a misspelt key stops the brain at start (DEC-106).
session_usd = 1.0
daily_usd = 5.0
hard_stop_usd = 10.0     # total since the brain started
requests_per_hour = 300  # loop guard
max_tokens = 1024        # per model request

[egress]
# Default deny: the only outside destinations the brain may contact. Jeff edits this list.
# Exact host names, optionally "host:port" (port 443 otherwise); no wildcards. Loopback (the link to
# the body) is always allowed and is not listed. Enforced in brain/egress.py for every socket the
# brain opens. The speech vendor is added here when chosen (card P2-04).
allowed_hosts = ["api.anthropic.com"]

[paths]
# data_dir must be a folder inside this project (relative, no ".."); absolute paths are refused.
data_dir = "data"
# The link token lives outside the repo, in a folder private to you inside your user profile
# (%LOCALAPPDATA%\EmbodiedAgent\secrets on Windows). Uncomment to put it elsewhere; the folder must not be
# inside a directory that other local accounts can modify. An absolute secrets_dir must be inside your user
# profile; a relative one is a folder inside this project.
# secrets_dir = "%LOCALAPPDATA%\\EmbodiedAgent\\secrets"

[logging]
# Full prompts and responses in a separate private capture file, for root-cause data during development
# (DEC-025, Jeff 13 Nov 2026: on while developing; re-evaluate when development ends). Card P0-07 writes it;
# it records whatever the microphone hears, so it stays Jeff-only. Bounded in size and age.
full_prompts = true
capture_max_mb = 200     # 1 to 1024
capture_max_days = 14    # 1 to 90
