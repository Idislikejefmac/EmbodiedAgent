# tests/trace_map.toml: maps collected pytest node ids to T- and R- ids without editing the tests
# (docs/testing/50 section 3.2). Read by tools/trace.py. New tests carry @pytest.mark.trace(...) or a
# docstring header instead ("T-P0-05-071 P5 R-FND-17: ...").
#
# [[file]]  default ownership of a whole file (never counts as coverage of a specific id)
# [[test]]  node (exact, or a glob such as "...::test_x[*]"), ids, optional promises, risks, classes
# [[manual]] a manual procedure whose evidence lives in a gate record
# [status]  card state (planned | in_progress | done) until docs/testing/status.toml exists
# [[waiver]] card, rule (0 to 6), item (a risk or promise id, or "*"), reason, owner, expires (YYYY-MM-DD)
#
# Seeded on 13 Nov 2026 by `python tools/trace.py seed` from doc 10 rows marked Existing (only rows whose
# function name matches exactly one collected test), then spot-checked. Stage 1b (below, "stage 1b" sections) maps the
# hardening, limits, config, flood, chaos and new X-01 tests: H-item groups take the T- ids that docs/testing/10 and 50 give
# those H-items; files without a verified id are owned by their card through [[file]] (no id is invented).

schema = 1

[scopes]
X01 = "X-01"

[status]
"P0-04" = "done"
"P0-05" = "done"
"P0-06" = "done"
"X-01" = "in_progress"

