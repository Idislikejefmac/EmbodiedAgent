# Entry-point manifest for the chaos and boundary harness (plan card X-01 step 1; check E8).
#
# Everything the system exposes, one record per entry point. `python -m brain chaos --check-manifest`
# discovers the same set from the real code (tools/chaos/manifest.py) and fails on any difference, in
# either direction, and on any change to a checked attribute (a tool's class, channels or sensitive
# flag; a message's senders; a close or binary type code; an Android component's exported flag or
# permission). So adding an entry point to the code without adding it here fails the build, and so
# does removing one without removing it here.
#
# A new card: run `python -m brain chaos --manifest-stub`, paste the printed lines into `entry` below,
# review `card` and `boundary` (B-ids: docs/testing/00 section 3), then register an experiment for them
# in tools/chaos/cases/ (tools/chaos/README.md). Keys per entry: id, kind, card, boundary, an optional
# note, and the checked attributes of its kind. Nothing here is executed.

