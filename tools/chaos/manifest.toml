# ---- gate functions (docs/testing/00 section 4.4: E1a and E1b read this table) ---------------------------
# name: dotted path that must import; boundary: B-id; produces: what it returns; limits: names from
# [limits] below (Appendix A names). E1b (planned) requires below/at/above tests for each limit.

[[gate]]
name = "brain.transport.protocol.decode"
boundary = "B1"
produces = "a JSON value (NaN and Infinity refused)"
limits = ["JSON_MAX_DEPTH"]
card = "P0-05"

[[gate]]
name = "brain.transport.protocol.validate"
boundary = "B1"
produces = "dict (a v0 message that passed the schema, direction and timestamp rules)"
limits = ["MAX_ID", "MAX_TS", "IDENTIFIER_MAX_CHARS", "NAME_MAX_CHARS", "HELLO_SOFTWARE_MAX_CHARS",
          "HELLO_NAMES_MAX", "ERROR_MESSAGE_MAX_CHARS", "ECHO_TEXT_MAX_CHARS", "SPOKEN_TEXT_MAX_CHARS",
          "MAX_BINARY_BYTES", "POSE_RATE_MAX_HZ", "CAPTURE_MAX_EDGE_PX_MIN", "CAPTURE_MAX_EDGE_PX_MAX"]
card = "P0-05"

[[gate]]
name = "brain.transport.protocol.unpack_binary"
boundary = "B2"
produces = "BinaryFrame"
limits = ["MAX_BINARY_BYTES", "MAX_TS"]
card = "P0-05"

[[gate]]
name = "brain.transport.protocol.check_pair"
boundary = "B2"
produces = "None (raises ProtocolError when the binary frame does not match its message)"
limits = []
card = "P0-05"

[[gate]]
name = "brain.transport.link.Link.recv"
boundary = "B1"
produces = "Received"
limits = ["MAX_TEXT_BYTES", "MAX_PEER_ERRORS_PER_MIN", "BINARY_PAIR_TIMEOUT_S", "PRE_AUTH_MAX_BYTES"]
card = "P0-05"

[[gate]]
name = "brain.transport.auth.parse_token"
boundary = "B10"
produces = "bytes (a 32-byte token)"
limits = ["TOKEN_BYTES"]
card = "P0-05"

[[gate]]
name = "brain.transport.auth.load_or_create_token"
boundary = "B10"
produces = "bytes (a 32-byte token from a store private to the user)"
limits = ["TOKEN_BYTES", "ACL_TOOL_TIMEOUT_S"]
card = "P0-05"

[[gate]]
name = "brain.agent.tools.Catalogue.from_json"
boundary = "B10"
produces = "Catalogue"
limits = ["TOOL_TIMEOUT_MAX_S", "TOOL_NAME_MAX_CHARS"]
card = "P0-06"

[[gate]]
name = "brain.agent.tools._plain_json_problem"
boundary = "B7"
produces = "str | None (why the arguments are not plain JSON of modest size)"
limits = ["MAX_ARGS_BYTES", "MAX_ARGS_DEPTH", "MAX_ARGS_NODES"]
card = "P0-06"

[[gate]]
name = "brain.agent.tools.ToolRegistry.call"
boundary = "B6"
produces = "ToolResult"
limits = ["MAX_ARGS_BYTES", "MAX_ARGS_DEPTH", "MAX_ARGS_NODES", "MAX_KEYS_SHOWN", "LOG_KEY_MAX_CHARS",
          "TOOL_NAME_MAX_CHARS", "TOOL_DEFAULT_TIMEOUT_S", "ABANDONED_TASKS_PER_TOOL_MAX"]
card = "P0-06"

[[gate]]
name = "brain.agent.tools.Caller"
boundary = "B20"
produces = "Caller"
limits = ["IDENTIFIER_MAX_CHARS"]
card = "P0-06"

[[gate]]
name = "brain.body.types.Pose"
boundary = "B3"
produces = "Pose"
limits = ["QUAT_NORM_TOL", "IDENTIFIER_MAX_CHARS"]
card = "P0-06"

[[gate]]
name = "brain.body.types.NavGoal"
boundary = "B3"
produces = "NavGoal"
limits = ["IDENTIFIER_MAX_CHARS"]
card = "P0-06"

[[gate]]
name = "brain.body.types.Image"
boundary = "B2"
produces = "Image"
limits = ["IDENTIFIER_MAX_CHARS", "MAX_BINARY_BYTES", "WIRE_IMAGE_EDGE_MAX_PX"]
card = "P0-06"

[[gate]]
name = "brain.body.types.AudioChunk"
boundary = "B2"
produces = "AudioChunk"
limits = ["AUDIO_SAMPLE_RATE_HZ_MIN", "AUDIO_SAMPLE_RATE_HZ_MAX", "AUDIO_CHANNELS_MAX", "MAX_BINARY_BYTES"]
card = "P0-06"

[[gate]]
name = "brain.body.types.BodyEvent"
boundary = "B3"
produces = "BodyEvent"
limits = ["NAME_MAX_CHARS"]
card = "P0-06"

[[gate]]
name = "brain.body.types.BodyStatus"
boundary = "B3"
produces = "BodyStatus"
limits = []
card = "P0-06"

[[gate]]
name = "brain.config.load_config"
boundary = "B10"
produces = "Config (frozen, typed; ConfigError names the file, the key and the reason)"
limits = ["CONFIG_MAX_BYTES", "PORT_MIN", "PORT_MAX", "SPEND_CAP_SANITY_MAX", "CONFIG_PATH_MAX_CHARS"]
card = "P0-04"

[[gate]]
name = "brain.config.parse_config"
boundary = "B10"
produces = "Config"
limits = ["PORT_MIN", "PORT_MAX", "SPEND_CAP_SANITY_MAX", "CONFIG_PATH_MAX_CHARS"]
card = "P0-04"

[[gate]]
name = "brain.config.parse_env_file"
boundary = "B10"
produces = "dict[str, str]"
limits = ["ENV_FILE_MAX_BYTES", "ENV_VALUE_MAX_CHARS"]
card = "P0-04"

[[gate]]
name = "brain.egress.EgressPolicy.from_hosts"
boundary = "B10"
produces = "EgressPolicy"
limits = []
card = "P0-06"

[[gate]]
name = "brain.egress.EgressPolicy.from_config"
boundary = "B10"
produces = "EgressPolicy"
limits = []
card = "P0-06"

[[gate]]
name = "tools.migrate.restore_data"
boundary = "B10"
produces = "list[str] (names restored)"
limits = ["SCRYPT_LOG_N", "PASSPHRASE_MIN_CHARS", "ARCHIVE_MAX_BYTES", "ARCHIVE_UNPACKED_MAX_BYTES",
          "ARCHIVE_MEMBERS_MAX"]
card = "P0-04"

[[gate]]
name = "tools.migrate.verify_archive"
boundary = "B10"
produces = "list[tuple[str, int, bool]] (entries; nothing extracted)"
limits = ["SCRYPT_LOG_N", "ARCHIVE_MAX_BYTES", "ARCHIVE_UNPACKED_MAX_BYTES", "ARCHIVE_MEMBERS_MAX"]
card = "P0-04"

[[gate]]
name = "brain.transport.flood.FloodGuard"
boundary = "B1"
produces = "FloodGuard (admit: is this valid message within its type's rate?)"
limits = ["PEER_MSG_MAX_PER_S", "PEER_EXCESS_MAX_PER_MIN", "HANDLER_QUEUE_MAX_BYTES", "EVENT_MAX_BYTES",
          "ECHO_TEST_MAX_BYTES", "MAX_IMAGE_BYTES", "AUDIO_IN_MAX_CHUNK_BYTES", "PEER_LOG_LINES_PER_MIN_MAX"]
card = "P0-05"

[[gate]]
name = "tools.chaos.manifest.load_manifest"
boundary = "B10"
produces = "Manifest"
limits = ["MANIFEST_MAX_BYTES"]
card = "X-01"

