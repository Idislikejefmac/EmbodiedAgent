[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent-brain"
version = "0.0.1"
description = "Laptop-side brain for the Embodied Agent trial"
requires-python = ">=3.13"  # 3.13: time.monotonic uses QueryPerformanceCounter on Windows (1 us, not 15.6 ms)
dependencies = [
    "cryptography>=42",
    "websockets>=17.4",  # tested version; the server checks at start that its pre-auth frame limit works
    "jsonschema>=4.18",
    "anthropic>=2.6",  # the model API SDK (card P0-07), built only in brain/egress.py; tested with 2.6.0 on httpx2 2.16.0
]

[project.optional-dependencies]
# Dev only (DEC-DEV-DEPS). The exact versions and hashes of everything installed are in requirements.lock (H-03),
# written by tools/make_lockfile.py; rerun it after changing a dependency.
dev = ["pytest>=8", "mypy>=1.13", "hypothesis>=6.170"]
# Local speech to text (card P2-04, docs/stt.md): installed 15 Nov 2026 on Python 3.13 / Windows; pinned to what was tested.
# No torch. Models are fetched once by tools/fetch_stt_model.py, not by pip. The GPU libraries are the optional extra stt-gpu.
stt = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "onnxruntime==1.32.0",  # the bundled voice-activity model
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",  # used only by tools/fetch_stt_model.py
    "av==19.0.2",
    "numpy==2.5.4",
]
# The CUDA 12 libraries for the GPU path (about 1.6 GB of downloads; Windows needs NVIDIA driver 525 or newer). Installed 15 Nov 2026.
# `pip install -e ".[stt,stt-gpu]"`. The engine finds their DLLs by itself (brain/voice/stt.py register_cuda_dlls).
stt-gpu = [
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.28.1.4",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
brain = ["agent/*.json", "agent/prompts/*.md"]  # the tool allowlist, the price table and the system prompt ship with the code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chaos: part of the chaos and boundary harness (tools/chaos; card X-01)",
    "slow: long-running (chaos --full and the like); skipped unless --run-slow",
    "real_vendor: would contact a real vendor or the real model; never collected into a normal run (C8); only with --run-real-vendor",
    "real_model: loads the downloaded local speech models (data/models/stt); never collected into a normal run; only with --run-real-model",
    "gate(name, limit=None, edge=None): an E1b edge test of a gate in tools/chaos/manifest.toml (below, at, above, wrong_type)",
    "trace(*ids, promises=(), risks=()): the T- ids, promises and R- ids this test covers (tools/trace.py)",
]

[tool.mypy]
# Run with:  python -m mypy   (checks the packages below in strict mode; tests/test_typing.py runs it too)
python_version = "3.13"
strict = true
files = ["brain/body", "brain/agent", "brain/obs", "brain/voice", "brain/config.py", "brain/profiles.py", "brain/egress.py", "brain/limits.py", "brain/logsafe.py", "brain/chat.py",
         "brain/transport", "brain/__main__.py", "tools/chaos", "tools/migrate.py", "tools/lint.py", "tools/fetch_stt_model.py", "tests/fakes/stt.py"]
explicit_package_bases = true  # tools/ has no __init__.py
follow_imports = "silent"  # tools/trace.py is imported but not yet checked (H-13 list below)

# Not yet strict (H-13 follow-up): brain/transport/auth.py (ctypes calls into the Windows security API; needs typed
# wrappers, and the token store is too important to retype in a hurry) and tools/trace.py (the trace card).
# brain/config.py (the typed Config gate) and tools/migrate.py joined in hardening batch 2 (H-05, H-01).
[[tool.mypy.overrides]]
module = ["brain.transport.auth"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# faster-whisper, ctranslate2 and huggingface_hub are imported lazily (brain/voice/stt.py, tools/fetch_stt_model.py);
# they are not followed here: their own types are not what is checked.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "ctranslate2.*", "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*"]
ignore_missing_imports = true
