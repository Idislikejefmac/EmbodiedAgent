[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent-brain"
version = "0.0.1"
description = "Laptop-side brain for the Embodied Agent trial"
requires-python = ">=3.13"  # 3.13: time.monotonic uses QueryPerformanceCounter on Windows (1 us, not 15.6 ms)
dependencies = [
    "cryptography>=42",
    "websockets>=17.4",  # tested version; the server checks at start that its pre-auth frame limit works
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Dev only (DEC-DEV-DEPS). A hash-pinned dev lockfile is a later task (H-03); until then these are lower bounds.
dev = ["pytest>=8", "mypy>=1.13", "hypothesis>=6.170"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
brain = ["agent/*.json"]  # the tool allowlist ships with the code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chaos: part of the chaos and boundary harness (tools/chaos; card X-01)",
    "slow: long-running (chaos --full and the like); skipped unless --run-slow",
    "real_vendor: would contact a real vendor or the real model; never collected into a normal run (C8)",
    "gate(name, limit=None, edge=None): an E1b edge test of a gate in tools/chaos/manifest.toml (below, at, above, wrong_type)",
    "trace(*ids, promises=(), risks=()): the T- ids, promises and R- ids this test covers (tools/trace.py)",
]

[tool.mypy]
# Run with:  python -m mypy   (checks the packages below in strict mode; tests/test_typing.py runs it too)
python_version = "3.13"
strict = true
files = ["brain/body", "brain/agent", "brain/egress.py", "brain/limits.py", "brain/logsafe.py", "brain/transport",
         "brain/__main__.py", "tools/chaos"]
explicit_package_bases = true  # tools/ has no __init__.py
follow_imports = "silent"  # brain/config.py and tools/migrate.py are imported but not yet checked (H-13 list below)

# Not yet strict (H-13 follow-up): brain/transport/auth.py (ctypes calls into the Windows security API; needs typed
# wrappers, and the token store is too important to retype in a hurry), brain/config.py (batch 2 rewrites it as the
# typed Config gate, H-05), tools/migrate.py and tools/trace.py (batch 2 and the trace card).
[[tool.mypy.overrides]]
module = ["brain.transport.auth"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
