[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent-brain"
version = "0.0.1"
description = "Laptop-side brain for the Embodied Agent trial"
requires-python = ">=3.13"  # 3.13: time.monotonic uses QueryPerformanceCounter on Windows (1 us, not 15.6 ms)
dependencies = [
    "cryptography>=42",
    "websockets>=17.4",  # tested version; the server checks at start that its pre-auth frame limit works
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

